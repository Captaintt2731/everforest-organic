# Everforest Organic — deep space backgrounds, everforest greens/teal as
# accents, cosmic purple highlights, warm sand foreground.
#
# Omarchy 4 (Quattro) palette. The old 8-color base16 schema (color0–color15)
# is no longer read; Quattro's templates resolve these named roles instead and
# generate the shell, terminals, btop, helix and vscode themes from them.

mode = "dark"

accent    = "#7fbbb3"
selection = "#3d4455"
muted     = "#5f6675"

background        = "#0d0f14"
dark_background   = "#090b0f"
darker_background = "#05070a"
lighter_background = "#1a1e2a"

foreground        = "#d3c6aa"
dark_foreground   = "#5c6470"
light_foreground  = "#a79c88"
bright_foreground = "#e8e0cc"

red     = "#e67e80"
yellow  = "#dbbc7f"
orange  = "#e09d7f"
green   = "#a7c080"
cyan    = "#83c092"
blue    = "#7fbbb3"
magenta = "#c387d6"
brown   = "#704e3f"

bright_red     = "#f85552"
bright_yellow  = "#e8ca8f"
bright_green   = "#b8cf8f"
bright_cyan    = "#99d3a8"
bright_blue    = "#9fcdd6"
bright_magenta = "#d49fe3"
